<!-- نموذج إرسال طلب الاشتراك الأصلي -->
<div style="max-width: 500px; margin: 20px auto; background: #f4f9f4; padding: 20px; border-radius: 8px; border: 1px solid #d4edda;">
  <div style="background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px;">
    مكتبة التركيبات الاحترافية متاحة فقط بعد إرسال بيانات التحويل وموافقة الإدارة يدوياً.
  </div>
  
  <p style="margin: 5px 0;"><strong>المستفيد:</strong> هاشم شرف الدين عبدالله إراهيم | <strong>بنك:</strong> 3465405 | <strong>الرسوم:</strong> 10,000 ج.س</p>
  
  <div style="margin-top: 15px;">
    <label style="display: block; margin-bottom: 5px;">الإسم الثلاثي:</label>
    <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
    
    <label style="display: block; margin-bottom: 5px;">رقم الهاتف (واتساب):</label>
    <input type="text" id="phoneNum" placeholder="09xxxxxxxx" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
    
    <label style="display: block; margin-bottom: 5px;">رقم عملية التحويل:</label>
    <input type="text" id="transferNum" placeholder="رقم العملية من إشعار بنكك" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;">
    
    <button id="submitOrderBtn" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">إرسال طلب الاشتراك للمراجعة</button>
  </div>
</div>

<!-- قسم تسجيل دخول الإدارة -->
<section id="adminLogin" style="max-width: 500px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
  <h3>دخول الإدارة</h3>
  <input id="adminEmail" type="email" placeholder="البريد الإلكتروني" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
  <input id="adminPassword" type="password" placeholder="كلمة المرور" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
  <button id="adminLoginButton" style="padding: 10px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">تسجيل الدخول</button>
  <p id="adminMessage" style="color: red; margin-top: 10px; font-size: 14px;"></p>
</section>

<!-- واجهة الإدارة -->
<section id="adminPanel" style="display: none; max-width: 500px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
  <h3 style="color: #28a745;">لوحة الإدارة</h3>
  <p>أهلاً بك، أنت مسجل دخول كمدير الآن.</p>
  <button id="adminLogoutButton" style="padding: 8px 15px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">تسجيل الخروج</button>
</section>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'ضع_رابط_مشروعك_هنا';
  const SUPABASE_ANON_KEY = 'ضع_مفتاح_النشر_العام_هنا';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginSection = document.getElementById('adminLogin');
  const panelSection = document.getElementById('adminPanel');
  const message = document.getElementById('adminMessage');

  // التحقق من حالة الدخول مسبقاً
  supabase.auth.getUser().then(({ data: { user } }) => {
    if (user) {
      loginSection.style.display = 'none';
      panelSection.style.display = 'block';
    }
  });

  // تسجيل الدخول
  document.getElementById('adminLoginButton').addEventListener('click', async () => {
    message.textContent = 'جارٍ التحقق...';
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      message.textContent = 'خطأ في البريد أو كلمة المرور.';
      return;
    }

    message.textContent = '';
    loginSection.style.display = 'none';
    panelSection.style.display = 'block';
  });

  // تسجيل الخروج
  document.getElementById('adminLogoutButton').addEventListener('click', async () => {
    await supabase.auth.signOut();
    panelSection.style.display = 'none';
    loginSection.style.display = 'block';
    document.getElementById('adminEmail').value = '';
    document.getElementById('adminPassword').value = '';
  });
</script>
