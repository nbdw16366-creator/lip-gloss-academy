<!-- تسجيل دخول المدير -->
<section id="adminLogin" hidden>
  <h2>دخول الإدارة</h2>
  <input id="adminEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="adminPassword" type="password" placeholder="كلمة المرور">
  <button id="adminLoginButton">تسجيل الدخول</button>
  <p id="adminMessage"></p>
</section>

<!-- ضع واجهة الإدارة الموجودة عندك داخل هذا القسم -->
<section id="adminPanel" hidden>
  <h2>لوحة الإدارة</h2>
  <p>تم التحقق من صلاحية المدير.</p>
  <button id="adminLogoutButton">تسجيل الخروج</button>
</section>

<script type="module">
  import { createClient } from
    'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'ضع_رابط_مشروعك_هنا';
  const SUPABASE_ANON_KEY = 'ضع_مفتاح_النشر_العام_هنا';

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const login = document.getElementById('adminLogin');
  const panel = document.getElementById('adminPanel');
  const message = document.getElementById('adminMessage');

  async function checkAdmin() {
    panel.hidden = true;

    const { data: { user } } =
      await supabase.auth.getUser();

    if (!user) {
      login.hidden = false;
      return;
    }

    const { data, error } = await supabase
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .maybeSingle();

    if (!error && data?.role === 'admin') {
      login.hidden = true;
      panel.hidden = false;
    } else {
      login.hidden = false;
      message.textContent = 'الحساب ما عنده صلاحية الإدارة.';
    }
  }

  document.getElementById('adminLoginButton')
    .addEventListener('click', async () => {
      message.textContent = 'جارٍ التحقق...';

      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('adminEmail').value.trim(),
        password: document.getElementById('adminPassword').value
      });

      if (error) {
        message.textContent = 'تعذّر الدخول. راجع بيانات الحساب.';
        return;
      }

      await checkAdmin();
    });

  document.getElementById('adminLogoutButton')
    .addEventListener('click', async () => {
      await supabase.auth.signOut();
      panel.hidden = true;
      login.hidden = false;
      message.textContent = '';
    });

  await checkAdmin();
</script>
