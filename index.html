<!-- تسجيل دخول المدير -->
<section id="adminLogin">
  <h2>دخول الإدارة</h2>
  <input id="adminEmail" type="email" placeholder="البريد الإلكتروني" style="display:block; margin: 10px 0; padding: 8px; width: 100%;">
  <input id="adminPassword" type="password" placeholder="كلمة المرور" style="display:block; margin: 10px 0; padding: 8px; width: 100%;">
  <button id="adminLoginButton" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">تسجيل الدخول</button>
  <p id="adminMessage" style="color: red; margin-top: 10px;"></p>
</section>

<!-- واجهة الإدارة -->
<section id="adminPanel" hidden>
  <h2>لوحة الإدارة - التحكم في التركيبات</h2>
  <p>أهلاً بك، تم تسجيل الدخول بنجاح كمدير.</p>
  
  <!-- حتة إضافة التركيبات أو عرض الطلبات -->
  <div style="background: #f9f9f9; padding: 15px; border: 1px solid #ddd; margin-top: 15px; border-radius: 5px;">
    <h3>إضافة تركيب جديد أو مراجعة الطلبات</h3>
    <p>من هنا يمكنك إدارة الطلبات والاشتراكات يدوياً بكل سهولة.</p>
  </div>

  <button id="adminLogoutButton" style="margin-top: 15px; padding: 8px 15px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">تسجيل الخروج</button>
</section>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // استبدل القيم دي برابط مشروعك والمفتاح العام حقك من سوبابيز
  const SUPABASE_URL = 'ضع_رابط_مشروعك_هنا';
  const SUPABASE_ANON_KEY = 'ضع_مفتاح_النشر_العام_هنا';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginSection = document.getElementById('adminLogin');
  const panelSection = document.getElementById('adminPanel');
  const message = document.getElementById('adminMessage');

  async function checkUser() {
    const { data: { user }, error } = await supabase.auth.getUser();
    
    if (error || !user) {
      loginSection.hidden = false;
      panelSection.hidden = true;
      return;
    }

    // إذا سجلت دخول صح، افتح اللوحة فوراً بدون تعقيد
    loginSection.hidden = true;
    panelSection.hidden = false;
  }

  document.getElementById('adminLoginButton').addEventListener('click', async () => {
    message.textContent = 'جارٍ تسجيل الدخول...';
    
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;

    const { error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      message.textContent = 'خطأ في الإيميل أو كلمة المرور، حاول تاني.';
      return;
    }

    message.textContent = '';
    await checkUser();
  });

  document.getElementById('adminLogoutButton').addEventListener('click', async () => {
    await supabase.auth.signOut();
    document.getElementById('adminEmail').value = '';
    document.getElementById('adminPassword').value = '';
    await checkUser();
  });

  // فحص الحالة عند فتح الصفحة
  await checkUser();
</script>
