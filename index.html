<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية لمعة الشفاه - تسجيل الطلاب</title>
    <!-- مكتبة Supabase للربط -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .form-container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #ff4b5c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #e03e4d; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>تسجيل طالب جديد - لمعة الشفاه</h2>
        <form id="signupForm">
            <input type="text" id="fullName" placeholder="الاسم الكامل" required>
            <input type="text" id="phone" placeholder="رقم الهاتف" required>
            <button type="submit">تسجيل</button>
        </form>
        <p id="msg"></p>
    </div>

    <script>
        // ضع هنا بيانات الـ Supabase الخاصة بك بدلاً من النصوص العربية
        const SUPABASE_URL = 'https://vuqafcykmgoaiqpqpwl.supabase.co';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_النشر_الذي_نسخته_هنا';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const msg = document.getElementById('msg');

            // إرسال البيانات إلى جدول users
            const { data, error } = await supabaseClient
                .from('users')
                .insert([
                    { full_name: fullName, phone: phone }
                ]);

            if (error) {
                msg.style.color = 'red';
                msg.textContent = 'حدث خطأ: ' + error.message;
            } else {
                msg.style.color = 'green';
                msg.textContent = 'تم التسجيل بنجاح!';
                document.getElementById('signupForm').reset();
            }
        });
    </script>

</body>
</html>
